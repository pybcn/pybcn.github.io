# The videos of the Python Barcelona YouTube channel, and what this site does
# with each one. One entry per video of the channel, with the id, the title
# as the channel shows it, and the decision: placed, which means some event
# page carries a link to it, or placed: false with the reason it belongs to
# no event page. One unplaced video is on the site all the same: the
# presentation of the community at PyConES 2020, which the home page plays
# (about_video in content/_index.md); its reason says so. placed stays
# about the event pages, which is what bin/check-content reads.
#
# This is the list the site maintains. It is not a copy of the pybcn-archive
# export, which is one-time archaeology that is not in this repository: the
# export says where a published fact came from, this file says what the
# channel holds today and whether the site accounts for it.
#
# bin/check-content reads this file and fails on three things: a placed
# entry that no event front matter carries, a YouTube video link in the
# front matter that no entry lists, and an unplaced entry with no reason.
# It never touches the network.
#
# How to refresh it: run bin/list-channel. It reads the two tabs of the
# channel that hold videos (videos and streams) with yt-dlp and prints every
# video the channel has and this list does not, and every entry of this list
# the tabs no longer show. For a new video, write its link on the talk of
# the event page by hand (a link of type video, or an entry of
# session_videos for the recording of a whole session), then add the entry
# here with placed: true. A video that belongs to no page gets placed: false
# and a reason. bin/list-channel --yaml prints the new entries ready to
# paste.
#
# unlisted: true marks a video the channel holds but no tab shows, because
# it was uploaded unlisted and only a playlist reveals it. bin/list-channel
# expects those to be absent from the tabs and says so, instead of reporting
# them as removed.
#
# The order of the entries is by id and means nothing. Append a new entry at
# the end if that is easier.
#
# First generated on 2026-10-13 from the two channel tabs read with yt-dlp
# (84 in videos, 3 in streams) plus the two unlisted videos the export
# found through its playlists, crossed with the video links of
# content/events/.

