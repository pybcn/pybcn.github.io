# The general assemblies of the association, newest first: the minutes of
# each one, and the photograph the association published of the act.
#
# The minutes are the record that the law asks for and they live on Google
# Drive, where the board writes them. The photograph is the only thing that
# says what the day looked like: there is no event page for an assembly, no
# gallery, and nothing else in this repository.
#
# caption is the text of the post, as published, less the t.co links. The
# one of 2022 is cut after the roles it announces: the rest of that post is
# a call to take part, which is four years old now.
#
# photo is a file under images/photos/assemblies/, stored as WebP at 600px
# on its long side, which is twice what the page draws. Five of the eight
# assemblies have one: 2020, 2024, and the extraordinary one of 2025 were
# never photographed, or the photograph was never published.
#
# source is the post. It is what the credit line links to, the way a photo
# of a gallery credits its own post.

