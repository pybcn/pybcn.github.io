# The short name the /events/ list prints for each venue. Left side: the
# venue string exactly as the front matter of the event carries it, which
# is the name the way its source wrote it, the Meetup export for the
# monthly meetups. Right side: the name a person in Barcelona says out
# loud. A row drops a marketing tagline ("El teu coworking a Gràcia"), an
# address ("Carrer Pallars 193."), a room ("Aula B7", "4ª Planta"), and a
# legal suffix ("and Company"), and it keeps a disambiguator when two
# venues would otherwise collide: three UPF places and three UPC places
# each keep the campus or the building in parentheses. It carries the
# accents of the real name even when the source lost them ("Biomedica",
# "Cibernarium"), because the short name is what the site prints.
#
# Every venue string of the content has a row, even when the short name
# is the long one, so this file is the full inventory and a reader can
# see what the site shows for each. Two rows with one short name are two
# spellings of one place: "Parc de Recerca Biomedica de Barcelona (PRBB)"
# and "Parc de Recerca Biomèdica de Barcelona (PRBB)" differ by one
# accent and the list printed them as two venues. The rows are sorted by
# the short name and then by the long one, so those rows sit together.
#
# Only the /events/ list reads this table, through
# layouts/_default/events_index.html. The page of a meetup keeps the full
# string: that page is about that day, and the full string is the fact its
# source recorded. In the list the short name carries the full one as its
# hover and as its accessible name, so nothing is lost by shortening.
#
# A venue with no row prints its full string in the list, and
# bin/check-content reports it as an error, the way it reports a row
# that no event uses, so the table cannot rot in either direction.
# Add the row here; never shorten the string in the event file.

