{{ define "main" }}

<div class="container" id="contact">
    <div class="row flex_box">
        <div class="col-md-4 general_contact">
            <div class="bordered_col">

                {{ if .Params.show_pybcn }}
                <h2 class="h4"><i class="fas fa-chevron-right" aria-hidden="true"></i> PyBCN</h2>
                <p>
                    <a href="mailto:{{ $.Site.Params.main_contact_email }}" aria-label="Email PyBCN at {{ $.Site.Params.main_contact_email }}"><i class="fa fa-2x fa-envelope" aria-hidden="true"></i></a>
                    {{ range $.Site.Params.social_items }}
                        <a href="{{ .link }}" target="_blank" aria-label="PyBCN on {{ .name }}"><i class="{{ .icon }}" aria-hidden="true"></i></a>
                    {{ end }}
                </p><br/>
                {{ end }}

                <h2 class="h4"><i class="fas fa-chevron-right" aria-hidden="true"></i> PyLadiesBCN</h2>
                <p>
                    <a href="mailto:{{ $.Site.Params.main_contact_email_pyladies }}" aria-label="Email PyLadiesBCN at {{ $.Site.Params.main_contact_email_pyladies }}"><i class="fa fa-2x fa-envelope" aria-hidden="true"></i></a>
                    {{ range $.Site.Params.social_items_pyladies }}
                        <a href="{{ .link }}" target="_blank" aria-label="PyLadiesBCN on {{ .name }}"><i class="{{ .icon }}" aria-hidden="true"></i></a>
                    {{ end }}
                </p>
            </div>
        </div>
        {{ .Content }}
    </div>
</div>

{{ end }}
