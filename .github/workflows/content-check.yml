name: content-check

# The deploy workflow only runs after a merge to edition. This one runs on the
# pull request, which is where a content problem must be caught.

on:
  pull_request:
  push:
    branches:
      - edition

jobs:
  html-safety:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check content for dangerous raw HTML
        run: ./bin/check-html-safety
