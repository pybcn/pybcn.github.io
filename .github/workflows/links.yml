# Check the external links of the site.
#
# Not part of the pull request checks. A link to another site breaks when
# that site changes, which is not something a pull request of ours causes
# or can fix, and asking for 139 external URLs on every pull request is
# both slow and close to behaving like a crawler. Run this when you want
# to know, which in practice is before a round of archive work.
#
# It never turns anything red. Read the report in the job summary.
name: links

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external:
    name: Check the external links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the Hugo version
        run: echo "HUGO_VERSION=$(tr -d '[:space:]' < .hugo-version)" >> "$GITHUB_ENV"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build
        run: hugo --minify -d public --baseURL /

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # --exclude-path: the frozen 2016-2019 snapshots under archives/
          #   keep their dead links on purpose.
          # --exclude: hosts that answer bots with 400, 403, or 999, and
          #   canary.invalid, the host the canary fixture names as text.
          #   lychee reads URLs out of text nodes too, and .invalid never
          #   resolves.
          args: >-
            --no-progress
            --exclude-all-private
            --max-concurrency 4
            --cache
            --max-cache-age 1w
            --root-dir "$GITHUB_WORKSPACE/public"
            --exclude-path 'public/archives/'
            --exclude 'twitter\.com'
            --exclude '^https?://(www\.)?x\.com/'
            --exclude 'linkedin\.com'
            --exclude 'pybcn\.slack\.com'
            --exclude 'canary\.invalid'
            'public/**/*.html'
          fail: false
