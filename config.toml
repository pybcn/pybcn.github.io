baseURL = "https://pybcn.org"
languageCode = "en-us"
title = "PyBCN - The Barcelona Python Association"
theme = "pybcn_theme"
enableGitInfo = true
enableRobotsTXT = true

# A cold build resizes every person photo and sponsor logo, which takes more
# than the 30s default that Hugo allows a single partial.
timeout = "300s"

# The site uses neither tags nor categories, and Hugo's defaults produced two
# empty index pages in the sitemap. The archive work will add its own taxonomy.
[taxonomies]

# llms.txt is a Hugo template, layouts/index.llms.txt, so it follows the site.
[outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true

# One feed for the whole site, /index.xml, and none per section. Hugo built
# one for every section by default: ten feeds, nine of them a by-product,
# from /contact/index.xml with zero items to /people/index.xml with 138
# items and no titles. The home feed carries the same pages, so a section
# feed adds nothing a reader can use (#201).
[outputs]
    home = ["HTML", "RSS", "llms"]
    section = ["HTML"]

# Every file under content/people/ and content/sponsors/ feeds the grids and
# the modals through its front matter. Hugo also built a page from each one,
# with no inbound link anywhere on the site, and they were 206 of the 247
# entries in the sitemap (#201). The sponsor pages are empty; 73 of the 138
# person files carried a bio that did render. #202 stopped them all, bio or
# not: publishing only the people who happen to have a paragraph written
# about them would sort the organizers and speakers of this association into
# two classes. The condition set then for their return was that the pages
# come back with the Archive, when every person has one worth linking to.
#
# The Archive met it, and the person pages are back: /people/<id>/, from
# themes/pybcn_theme/layouts/people/single.html, one per record, the way
# the site has a page per event and a page per talk. Measured in this
# tree when the pages came back: 378 files
# under content/people/, one of them the draft canary fixture of
# bin/check-rendered, so 377 records. 353 are credited by at least one
# talk, 124 are listed in at least one page block (the board, a committee,
# a team, a speaker list), and 371 by one or the other. The content of a
# person page is what the Archive says about the person: the talks, each
# linking to its talk page, the photos of those talks, the events, and the
# roles, plus the photo, the bio, and the links of the record itself. So a
# page is no longer a heading with nothing under it, and every one has an
# inbound link: the speaker name of every talk row of /talks/ goes to it
# through partials/person_link.html, and so does the name on its row of
# /people/.
#
# Six records are credited by nothing: david-blazquez-garcia, marc-pomar,
# patricio-reyes-valenzuela, peter-krupa, ricardo-martinez, and
# thomas-alisi (bin/check-content names them in a note). They get a page
# all the same, with the photo, the bio, the position, or the links their
# file carries, and the two-classes argument of #201 is the reason: taking
# the page away from the six whose programme has not been credited yet
# would sort the people of the archive into the ones with a page and the
# ones without, on a fact about the import and not about them. The
# figure that used to be the point here, that 240 of the 378 records hold
# an id and a name and nothing else, is still true and no longer matters:
# the content of a person page comes from the Archive, not from the front
# matter.
#
# The sponsor pages stay stopped. render = "never" stops the page and
# keeps the default list = "always", so the file stays in site.Pages,
# where sponsors-grid.html looks it up by id. list = "local" would take it
# out of site.Pages and empty the grid. A page that is not rendered has no
# permalink, which is how the feed template leaves it out
# (layouts/_default/rss.xml). /sponsors/ is a real page and stays.
#
# The person pages are in the sitemap and not in the home feed:
# layouts/_default/rss.xml leaves the people section out by name, as it
# does the talks, because 377 pages that arrive in one build are not 377
# publications and would push every item a reader could use out of the
# window their reader keeps. /people/ builds no feed of its own: section =
# ["HTML"] above stops every section feed (#201).
[[cascade]]
    [cascade._build]
        render = "never"
    [cascade._target]
        path = "/sponsors/*"


[markup.goldmark.renderer]
unsafe=true

[params]
    main_contact_name = "PyBCN Organizers"
    main_contact_email = "pybcn@googlegroups.com"
    short_name = "PyBCN"
    extended_name = "The Barcelona Python Association"

    # Who the association is in law. Spanish law 34/2002 (LSSI-CE) article 10
    # requires a site run by an association to publish its name, its address,
    # an email, its entry in the register it is recorded in, and its tax
    # number. The legal notice page is what shows them, and reads them from
    # here rather than holding them in its own text, so that the association
    # can correct a fact without a volunteer editing a page of legal prose.
    #
    # The values match the association's entry in the Registre d'Entitats de
    # la Generalitat de Catalunya, which is public open data:
    # https://analisi.transparenciacatalunya.cat/d/y6fz-g3ff
    # Only the Management Board changes address, registry or registered_on:
    # they describe the association as the register records it, not as
    # volunteers know it. The register names the register itself, not only
    # the number, because article 10 asks for the entry in the register and a
    # bare number names no register. bin/check-content reports an empty
    # address or registry as a warning. The legal notice page cannot be
    # published while either is empty: the page is the one place the law
    # asks for them, and a page that leaves them out does not do its job.
    [params.association]
        legal_name = "Associació Python Barcelona"
        tax_id = "G67254045"
        address = "Carrer de Concepció Arenal, 165, 08027 Barcelona"
        registry = "Registre d'Associacions de la Generalitat de Catalunya, núm. 64158"

    main_contact_name_pyladies = "PyLadiesBCN Organizers"
    main_contact_email_pyladies = "pyladies-bcn@googlegroups.com"

    # The order of the row, by reach, measured on 2026-10-16 where the
    # account publishes a number: Meetup 4,669 members of python-barcelona
    # (plus 919 of pyladies-bcn), YouTube 351 subscribers, Bluesky 229
    # followers, GitHub 27. X and LinkedIn answer nothing without an
    # account, so they sit on the judgement that X has the longest history
    # of the set, 987 archived tweet ids and every photo thread of the
    # archive, and that LinkedIn is the professional one. Slack is last
    # because it is a workspace to join and not a feed to read.
    #
    # weight is what partials/footer.html sorts by. Without it Hugo ranges
    # the map by key, which is alphabetical and put Bluesky first for no
    # reason other than its name.
    [params.social_items]
        [params.social_items.meetup]
            weight = 1
            name = "Meetup"
            link = "https://www.meetup.com/python-barcelona/"
            icon = "fab fa-meetup fa-2x"
        [params.social_items.twitter]
            weight = 3
            name = "X"
            icon = "icon_x fa-2x"
            link = "https://x.com/PyBCN"
        [params.social_items.linkedin]
            weight = 2
            name = "LinkedIn"
            link = "https://linkedin.com/company/pybcn"
            icon = "fab fa-linkedin fa-2x"
        [params.social_items.youtube]
            weight = 4
            name = "YouTube"
            link = "https://www.youtube.com/c/PythonBarcelona"
            icon = "fab fa-youtube-square fa-2x"
        [params.social_items.bluesky]
            weight = 5
            name = "Bluesky"
            link = "https://bsky.app/profile/pybcn.org"
            icon = "icon_bluesky fa-2x"
        [params.social_items.github]
            weight = 7
            name = "GitHub"
            link = "https://github.com/pybcn"
            icon = "fab fa-github fa-2x"
        [params.social_items.slack]
            weight = 6
            name = "Slack"
            link = "https://pybcn.slack.com"
            icon = "fab fa-slack fa-2x"
    [params.social_items_pyladies]
        [params.social_items_pyladies.twitter]
            weight = 3
            name = "X"
            icon = "icon_x fa-2x"
            link = "https://x.com/PyLadiesBCN"
        [params.social_items_pyladies.meetup]
            weight = 1
            name = "Meetup"
            link = "https://www.meetup.com/PyLadies-BCN"
            icon = "fab fa-meetup fa-2x"
        [params.social_items_pyladies.github]
            weight = 7
            name = "GitHub"
            link = "https://github.com/pyladies-bcn"
            icon = "fab fa-github fa-2x"


[services]
  [services.rss]
    # A feed is a window, not an archive. The site has 282 event pages and
    # one page per talk and per person, so an unlimited feed would be a few
    # hundred items of which a reader would see the newest twenty anyway.
    limit = 20
