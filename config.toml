baseURL = "https://pybcn.org"
languageCode = "en-us"
title = "PyBCN - The Barcelona Python Association"
theme = "pybcn_theme"
enableGitInfo = true
enableRobotsTXT = true

# A cold build resizes every person photo and sponsor logo, which takes more
# than the 30s default that Hugo allows a single partial.
timeout = "300s"

# The site uses neither tags nor categories, and Hugo's defaults produced two
# empty index pages in the sitemap. The archive work will add its own taxonomy.
[taxonomies]

# llms.txt is a Hugo template, layouts/index.llms.txt, so it follows the site.
[outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true

[outputs]
    home = ["HTML", "RSS", "llms"]


[markup.goldmark.renderer]
unsafe=true

[params]
    main_contact_name = "PyBCN Organizers"
    main_contact_email = "pybcn@googlegroups.com"
    short_name = "PyBCN"
    extended_name = "The Barcelona Python Association"

    # Who the association is in law. Spanish law 34/2002 (LSSI-CE) article 10
    # requires a site run by an association to publish its name, its address,
    # an email, its entry in the register it is recorded in, and its tax
    # number. The legal notice page is what shows them, and reads them from
    # here rather than holding them in its own text, so that the association
    # can correct a fact without a volunteer editing a page of legal prose.
    #
    # address and registry are empty and only the Management Board can fill
    # them. bin/check-content reports an empty one as a warning. The legal
    # notice page cannot be published while they are empty: the page is the
    # one place the law asks for them, and a page that leaves them out does
    # not do the job it exists for.
    [params.association]
        legal_name = "Associació Python Barcelona"
        tax_id = "G67254045"
        address = ""
        registry = ""

    main_contact_name_pyladies = "PyLadiesBCN Organizers"
    main_contact_email_pyladies = "pyladies-bcn@googlegroups.com"

    [params.social_items]
        [params.social_items.twitter]
            name = "X"
            icon = "icon_x fa-2x"
            link = "https://twitter.com/PyBCN"
        [params.social_items.youtube]
            name = "YouTube"
            link = "https://www.youtube.com/c/PythonBarcelona"
            icon = "fab fa-youtube-square fa-2x"
        [params.social_items.meetup]
            name = "Meetup"
            link = "https://www.meetup.com/python-barcelona/"
            icon = "fab fa-meetup fa-2x"
        [params.social_items.github]
            name = "GitHub"
            link = "https://github.com/pybcn"
            icon = "fab fa-github fa-2x"
        [params.social_items.linkedin]
            name = "LinkedIn"
            link = "https://linkedin.com/company/pybcn"
            icon = "fab fa-linkedin fa-2x"
        [params.social_items.slack]
            name = "Slack"
            link = "https://pybcn.slack.com"
            icon = "fab fa-slack fa-2x"

    [params.social_items_pyladies]
        [params.social_items_pyladies.twitter]
            name = "X"
            icon = "icon_x fa-2x"
            link = "https://twitter.com/PyLadiesBCN"
        [params.social_items_pyladies.meetup]
            name = "Meetup"
            link = "https://www.meetup.com/PyLadies-BCN"
            icon = "fab fa-meetup fa-2x"
        [params.social_items_pyladies.github]
            name = "GitHub"
            link = "https://github.com/pyladies-bcn"
            icon = "fab fa-github fa-2x"

