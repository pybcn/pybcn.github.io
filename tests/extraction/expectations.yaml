# What bin/check-extraction must say about each recorded model run.
#
# These are real outputs from the 2026-10-11 measurement, kept so the check
# itself has a regression test. Six runs must pass and one must fail: a check
# that only ever sees good input proves nothing.
#
# literal: the verdict of the literalness check against the normalized source.
# benchmark: the score against truth.yaml.

haiku-1:
  note: "Haiku 4.5, plain prompt, run 1 of 3. Clean."
  literal:
    verdict: pass
    fields_checked: 29
    identical_to_normalized_source: 29
    spacing_warnings: 0
    accent_or_case_errors: 0
    content_errors: 0
    truncated_errors: 0
  benchmark:
    talks: 23
    required_missing: 0
    spurious: 0
    wrong_speakers: 0
    ungrounded_fields: 0
    ambiguous_included: 2

