haiku-typography-rule-2:
  note: "Haiku 4.5 with the same rule, run 2 of 2. THIS RUN MUST FAIL. The rule did not stop it from changing the apostrophe, and it wrote Historia with an acute accent where the source has Historia with a grave accent. That is a spelling change, not typography, so no normalizer can forgive it. This fixture is what proves the check rejects a corrupted run."
  literal:
    verdict: fail
    fields_checked: 29
    identical_to_normalized_source: 28
    spacing_warnings: 0
    accent_or_case_errors: 1
