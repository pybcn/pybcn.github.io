# Ground truth for the extraction benchmark.
#
# Read by hand from the Meetup export before any model ran, so the benchmark
# measures a model against a human reference and not against another model.
# Never regenerate this file with a model.
#
# required: every talk that any correct extraction must find.
# ambiguous: the source does not settle it. Finding it or not is both correct,
#   so these count neither as a miss nor as a spurious talk. This file records
#   what the source supports, not what we chose to do about it:
#   bin/prompts/extract-talks.md settles both of these by convention, so a run
#   made with that prompt is expected to include them. The recorded runs under
#   model-runs/ predate the convention, which is why they disagree here.
# speakers: the expected speaker names, as the source writes them.

